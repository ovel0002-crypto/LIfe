<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover + safe-area insets = edge-to-edge like a native app -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F6F5F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)" />
    <!-- iOS home-screen app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Life" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="format-detection" content="telephone=no" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background: #f6f5f2;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #111110;
        }
      }
      body {
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* No text-selection flashes on long-press, like a native app */
      #root * {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #root input,
      #root textarea {
        -webkit-user-select: text;
        user-select: text;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Life.</noscript>
    <div id="root"></div>
  </body>
</html>
